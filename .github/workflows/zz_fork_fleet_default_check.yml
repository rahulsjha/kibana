name: fork-check-fleet-default
on:
  push:
    branches: [ci/fleet-default-is-default]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TEST: x-pack/platform/plugins/shared/fleet/server/services/fleet_server_host.test.ts
      SRC: x-pack/platform/plugins/shared/fleet/server/services/fleet_server_host.ts
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Bootstrap
        run: |
          corepack enable
          pnpm kbn bootstrap
      - name: Jest
        run: set -o pipefail; node scripts/jest $TEST 2>&1 | tee jest.log
      - name: ESLint
        if: always()
        run: set -o pipefail; node scripts/eslint $SRC $TEST 2>&1 | tee eslint.log
      - name: Without the fix the new tests must fail
        if: always()
        run: |
          git show HEAD~2:$SRC > $SRC
          git diff --stat
          if node scripts/jest $TEST -t "no longer the default|not the default either" 2>&1 | tee nofix.log; then
            echo "UNEXPECTED: the new tests pass without the fix"; exit 1
          fi
          grep -E "Tests:|✕|✓" nofix.log | tail -10
      - name: Summary
        if: always()
        run: |
          grep -E "Tests:|Test Suites:|✓|✕" jest.log | tail -60 || true
          tail -15 eslint.log || true
